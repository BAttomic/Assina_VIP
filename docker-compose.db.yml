# assina-postgres — banco do Assina VIP (PostgreSQL 16). Compose separado do app (projeto Dokploy assina_vip).
# Sem porta exposta e sem egress: só na net-assina-data (overlay --internal, criar 1× via SSH):
#   docker network create --driver overlay --attachable --internal net-assina-data

services:
  assina-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # `:?` aborta o deploy se a variável faltar na aba Environment. Sem isso o compose sobe com
    # string vazia e o init (que só roda 1× no volume vazio) quebra no meio — o volume fica
    # inicializado sem o usuário do app e o init nunca mais roda.
    environment:
      POSTGRES_USER: ${PG_SUPER_USER:?defina PG_SUPER_USER no Environment}
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD:?defina PG_SUPER_PASSWORD no Environment}
      POSTGRES_DB: postgres
      APP_DB: assina_vip
      APP_USER: ${PG_APP_USER:?defina PG_APP_USER no Environment}
      APP_PASSWORD: ${PG_APP_PASSWORD:?defina PG_APP_PASSWORD no Environment}
    volumes:
      - vol-assina-postgres:/var/lib/postgresql/data
      # Só roda no primeiro boot (volume vazio): cria o usuário do app como dono do database assina_vip.
      - ./init/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [net-assina-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vol-assina-postgres:

networks:
  net-assina-data: { external: true }
